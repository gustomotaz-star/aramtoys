<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Your Cart — Aram Toys</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Baloo+2:wght@600;700;800&family=Nunito+Sans:wght@400;600;700;800&family=Space+Mono:wght@700&family=Baloo+Bhaijaan+2:wght@600;700;800&family=Tajawal:wght@400;500;700;800&display=swap" rel="stylesheet">
<link rel="stylesheet" href="assets/css/rtl.css">
<style>
  :root{
    --cream:#FBF6EC; --ink:#2B2A4C; --coral:#FF6B5B; --mustard:#FFC145; --mint:#4ECDC4;
    --paper:#FFFFFF; --line: rgba(43,42,76,0.12);
  }
  *{box-sizing:border-box; margin:0; padding:0;}
  body{ background:var(--cream); color:var(--ink); font-family:'Nunito Sans', sans-serif; }
  a{color:inherit; text-decoration:none;}
  .wrap{ max-width:760px; margin:0 auto; padding:40px 24px; }

  header{ display:flex; align-items:center; justify-content:space-between; margin-bottom:32px; }
  .block-logo{ display:flex; gap:4px; }
  .block-logo .tile{
    width:30px; height:30px; border-radius:7px;
    display:flex; align-items:center; justify-content:center;
    font-family:'Baloo 2', sans-serif; font-weight:800; font-size:15px; color:var(--paper);
  }
  .block-logo .tile:nth-child(1){background:var(--coral);}
  .block-logo .tile:nth-child(2){background:var(--mustard); color:var(--ink);}
  .block-logo .tile:nth-child(3){background:var(--mint);}
  .block-logo .tile:nth-child(4){background:var(--ink);}
  .back-link{ font-weight:700; font-size:14px; color:rgba(43,42,76,0.6); }

  h1{ font-family:'Baloo 2', sans-serif; font-size:28px; margin-bottom:24px; }

  .item{
    background:var(--paper); border:1px solid var(--line); border-radius:16px;
    padding:16px 18px; display:flex; align-items:center; justify-content:space-between;
    margin-bottom:14px; gap:16px; flex-wrap:wrap;
  }
  .item-name{ font-family:'Baloo 2', sans-serif; font-weight:700; font-size:16px; flex:1; min-width:140px; }
  .qty-control{ display:flex; align-items:center; gap:10px; }
  .qty-btn{
    width:28px; height:28px; border-radius:8px; border:2px solid var(--ink);
    background:transparent; font-weight:800; cursor:pointer; font-family:inherit; font-size:15px;
  }
  .qty-val{ font-weight:700; min-width:20px; text-align:center; }
  .item-price{ font-family:'Space Mono', monospace; font-weight:700; min-width:80px; text-align:right; }
  .remove-btn{ background:none; border:none; color:var(--coral); font-weight:700; font-size:13px; cursor:pointer; font-family:inherit; }

  .summary{ background:var(--ink); color:var(--cream); border-radius:18px; padding:24px; margin-top:24px; }
  .summary-row{ display:flex; justify-content:space-between; padding:6px 0; font-size:14px; }
  .summary-row.total{ font-size:18px; font-weight:800; border-top:1px solid rgba(251,246,236,0.2); margin-top:8px; padding-top:14px; }

  .checkout-btn{
    display:block; width:100%; text-align:center; margin-top:18px; padding:14px;
    background:var(--coral); color:#fff; border-radius:14px; font-weight:800; font-size:15px;
  }

  .empty{ text-align:center; padding:60px 20px; color:rgba(43,42,76,0.6); }
  .empty a{ color:var(--coral); font-weight:700; }
</style>
</head>
<body>
<div class="wrap">
  <header>
    <a href="index.html" class="block-logo" aria-label="Aram Toys">
      <span class="tile">A</span><span class="tile">R</span><span class="tile">A</span><span class="tile">M</span>
    </a>
    <div style="display:flex; align-items:center; gap:14px;">
      <button class="lang-toggle" aria-label="Change language">English</button>
      <a href="index.html" class="back-link" data-i18n="cart_continue">← Continue Shopping</a>
    </div>
  </header>

  <h1 data-i18n="cart_title">Your Cart</h1>

  <div id="cart-items"></div>
  <div id="cart-summary"></div>
  <div id="empty-state" class="empty" style="display:none;">
    <span data-i18n="cart_empty">Your cart is empty.</span> <a href="index.html" data-i18n="cart_browse">Browse toys →</a>
  </div>

  <div style="text-align:center; margin-top:32px;">
    <button class="lang-toggle" aria-label="Change language">English</button>
  </div>
</div>

<script src="assets/js/i18n.js"></script>
<script src="assets/js/cart.js"></script>
<script>
  function render() {
    const cart = getCart();
    const itemsEl = document.getElementById('cart-items');
    const summaryEl = document.getElementById('cart-summary');
    const emptyEl = document.getElementById('empty-state');

    if (!cart.length) {
      itemsEl.innerHTML = '';
      summaryEl.innerHTML = '';
      emptyEl.style.display = 'block';
      return;
    }
    emptyEl.style.display = 'none';

    itemsEl.innerHTML = cart.map(item => `
      <div class="item">
        <span class="item-name">${item.name}</span>
        <div class="qty-control">
          <button class="qty-btn" data-action="dec" data-id="${item.id}">−</button>
          <span class="qty-val">${item.quantity}</span>
          <button class="qty-btn" data-action="inc" data-id="${item.id}">+</button>
        </div>
        <span class="item-price">${(item.price * item.quantity).toFixed(0)} EGP</span>
        <button class="remove-btn" data-action="remove" data-id="${item.id}">${t('cart_remove')}</button>
      </div>
    `).join('');

    const subtotal = getCartSubtotal();
    const shipping = getShippingFee(subtotal);
    summaryEl.innerHTML = `
      <div class="summary">
        <div class="summary-row"><span>${t('cart_subtotal')}</span><span>${subtotal.toFixed(0)} EGP</span></div>
        <div class="summary-row"><span>${t('cart_shipping')}</span><span>${shipping === 0 ? t('cart_free') : shipping.toFixed(0) + ' EGP'}</span></div>
        <div class="summary-row total"><span>${t('cart_total')}</span><span>${(subtotal + shipping).toFixed(0)} EGP</span></div>
      </div>
      <a href="checkout.html" class="checkout-btn">${t('cart_checkout')}</a>
    `;
  }

  document.addEventListener('langchange', render);

  document.addEventListener('click', (e) => {
    const btn = e.target.closest('[data-action]');
    if (!btn) return;
    const id = btn.dataset.id;
    const cart = getCart();
    const item = cart.find(i => i.id === id);
    if (!item) return;

    if (btn.dataset.action === 'inc') updateQuantity(id, item.quantity + 1);
    if (btn.dataset.action === 'dec') updateQuantity(id, item.quantity - 1);
    if (btn.dataset.action === 'remove') removeFromCart(id);

    render();
  });

  render();
</script>
</body>
</html>
