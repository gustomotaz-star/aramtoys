<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Dashboard — Aram Toys Management</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Baloo+2:wght@600;700;800&family=Nunito+Sans:wght@400;600;700;800&family=Space+Mono:wght@700&display=swap" rel="stylesheet">
<style>
  :root{
    --cream:#FBF6EC; --ink:#2B2A4C; --coral:#FF6B5B; --mustard:#FFC145; --mint:#4ECDC4;
    --paper:#FFFFFF; --line: rgba(43,42,76,0.12);
  }
  *{box-sizing:border-box; margin:0; padding:0;}
  body{ background:var(--cream); color:var(--ink); font-family:'Nunito Sans', sans-serif; }
  a{color:inherit; text-decoration:none;}
  .wrap{ max-width:1100px; margin:0 auto; padding:32px 24px 60px; }

  header{ display:flex; align-items:center; justify-content:space-between; margin-bottom:28px; flex-wrap:wrap; gap:12px; }
  .block-logo{ display:flex; gap:4px; align-items:center; }
  .block-logo .tile{
    width:30px; height:30px; border-radius:7px;
    display:flex; align-items:center; justify-content:center;
    font-family:'Baloo 2', sans-serif; font-weight:800; font-size:15px; color:var(--paper);
  }
  .block-logo .tile:nth-child(1){background:var(--coral);}
  .block-logo .tile:nth-child(2){background:var(--mustard); color:var(--ink);}
  .block-logo .tile:nth-child(3){background:var(--mint);}
  .block-logo .tile:nth-child(4){background:var(--ink);}
  .tag{ font-family:'Space Mono', monospace; font-size:11px; background:var(--ink); color:var(--cream); padding:3px 10px; border-radius:100px; margin-left:6px; }

  .signout{ font-weight:700; font-size:13px; padding:9px 16px; border-radius:10px; border:2px solid var(--ink); cursor:pointer; background:transparent; font-family:inherit; }

  .tabs{ display:flex; gap:8px; margin-bottom:24px; flex-wrap:wrap; }
  .tab-btn{
    padding:10px 18px; border-radius:12px; border:none; font-weight:700; font-size:13px;
    background:var(--paper); border:1px solid var(--line); cursor:pointer; font-family:inherit;
  }
  .tab-btn.active{ background:var(--ink); color:var(--cream); }

  .stat-grid{ display:grid; grid-template-columns:repeat(4,1fr); gap:16px; margin-bottom:28px; }
  .stat-card{ background:var(--paper); border:1px solid var(--line); border-radius:16px; padding:20px; }
  .stat-card .label{ font-size:12px; color:rgba(43,42,76,0.55); font-weight:700; text-transform:uppercase; letter-spacing:0.04em; margin-bottom:8px; }
  .stat-card .value{ font-family:'Baloo 2', sans-serif; font-size:26px; }
  @media (max-width:820px){ .stat-grid{ grid-template-columns:repeat(2,1fr); } }

  .panel{ display:none; }
  .panel.active{ display:block; }

  table{ width:100%; border-collapse:collapse; background:var(--paper); border-radius:14px; overflow:hidden; border:1px solid var(--line); }
  th, td{ padding:12px 14px; text-align:left; font-size:13px; border-bottom:1px solid var(--line); vertical-align:top; }
  th{ background:var(--ink); color:var(--cream); font-size:11px; text-transform:uppercase; letter-spacing:0.04em; }
  tr:last-child td{ border-bottom:none; }
  .table-wrap{ overflow-x:auto; }

  select, .stock-input{
    padding:6px 8px; border-radius:8px; border:1px solid var(--line); font-family:inherit; font-size:12px;
  }
  .mark-paid-btn{
    padding:6px 10px; border-radius:8px; border:none; background:var(--mint); color:var(--ink);
    font-weight:700; font-size:11px; cursor:pointer; font-family:inherit;
  }
  .badge{ padding:3px 8px; border-radius:100px; font-size:11px; font-weight:700; }
  .badge.paid{ background:#d6f5e8; color:#1a8f5c; }
  .badge.unpaid{ background:#ffe3de; color:var(--coral); }
  .low-stock{ color:var(--coral); font-weight:800; }

  h2.section-title{ font-family:'Baloo 2', sans-serif; font-size:18px; margin-bottom:14px; }
  .empty-note{ color:rgba(43,42,76,0.5); font-size:13px; padding:20px; text-align:center; }
</style>
</head>
<body>
<div class="wrap">
  <header>
    <div class="block-logo">
      <span class="tile">A</span><span class="tile">R</span><span class="tile">A</span><span class="tile">M</span>
      <span class="tag">MANAGEMENT</span>
    </div>
    <button class="signout" id="signout-btn">Sign Out</button>
  </header>

  <div class="tabs">
    <button class="tab-btn active" data-panel="overview">Overview</button>
    <button class="tab-btn" data-panel="orders">Orders</button>
    <button class="tab-btn" data-panel="customers">Customers</button>
    <button class="tab-btn" data-panel="inventory">Inventory</button>
  </div>

  <div class="panel active" id="panel-overview">
    <div class="stat-grid">
      <div class="stat-card"><div class="label">Total Orders</div><div class="value" id="stat-orders">—</div></div>
      <div class="stat-card"><div class="label">Total Revenue</div><div class="value" id="stat-revenue">—</div></div>
      <div class="stat-card"><div class="label">Pending Orders</div><div class="value" id="stat-pending">—</div></div>
      <div class="stat-card"><div class="label">Low Stock Items</div><div class="value" id="stat-lowstock">—</div></div>
    </div>
  </div>

  <div class="panel" id="panel-orders">
    <h2 class="section-title">Orders</h2>
    <div class="table-wrap">
      <table>
        <thead><tr><th>Date</th><th>Customer</th><th>Address</th><th>Items</th><th>Total</th><th>Payment</th><th>Status</th><th>Actions</th></tr></thead>
        <tbody id="orders-tbody"></tbody>
      </table>
    </div>
  </div>

  <div class="panel" id="panel-customers">
    <h2 class="section-title">Customers</h2>
    <div class="table-wrap">
      <table>
        <thead><tr><th>Email</th><th>Name</th><th>Phone</th><th>Joined</th></tr></thead>
        <tbody id="customers-tbody"></tbody>
      </table>
    </div>
  </div>

  <div class="panel" id="panel-inventory">
    <h2 class="section-title">Inventory</h2>
    <button class="tab-btn" id="toggle-add-product" type="button" style="margin-bottom:16px;">+ Add New Product</button>
    <form id="add-product-form" class="table-wrap" style="display:none; background:var(--paper); border:1px solid var(--line); border-radius:14px; padding:20px; margin-bottom:20px;">
      <div style="display:grid; grid-template-columns:1fr 1fr; gap:12px; margin-bottom:12px;">
        <input type="text" id="new-name" placeholder="Product name (English)" required style="padding:9px 12px; border-radius:8px; border:1px solid var(--line); font-family:inherit;">
        <input type="text" id="new-name-ar" placeholder="اسم المنتج (عربي)" style="padding:9px 12px; border-radius:8px; border:1px solid var(--line); font-family:inherit;">
        <select id="new-category" required style="padding:9px 12px; border-radius:8px; border:1px solid var(--line); font-family:inherit;"></select>
        <input type="number" id="new-price" placeholder="Price (EGP)" min="0" step="0.01" required style="padding:9px 12px; border-radius:8px; border:1px solid var(--line); font-family:inherit;">
        <input type="number" id="new-stock" placeholder="Stock quantity" min="0" required style="padding:9px 12px; border-radius:8px; border:1px solid var(--line); font-family:inherit;">
        <input type="text" id="new-badge" placeholder="Badge (optional, e.g. New)" style="padding:9px 12px; border-radius:8px; border:1px solid var(--line); font-family:inherit;">
      </div>
      <label style="font-size:12px; font-weight:700; display:block; margin-bottom:6px;">Product Photo</label>
      <input type="file" id="new-image" accept="image/*" style="margin-bottom:14px;">
      <br>
      <button type="submit" class="mark-paid-btn" id="save-new-product-btn">Save Product</button>
      <span id="add-product-msg" style="font-size:12px; color:var(--coral); margin-left:10px;"></span>
    </form>
    <div class="table-wrap">
      <table>
        <thead><tr><th>Photo</th><th>Product</th><th>Category</th><th>Price (EGP)</th><th>Stock</th><th></th></tr></thead>
        <tbody id="inventory-tbody"></tbody>
      </table>
    </div>
  </div>
</div>

<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2/dist/umd/supabase.js"></script>
<script src="assets/js/supabase-client.js"></script>
<script>
  const LOW_STOCK_THRESHOLD = 10;

  document.querySelectorAll('.tab-btn').forEach(btn => {
    btn.addEventListener('click', () => {
      document.querySelectorAll('.tab-btn').forEach(b => b.classList.remove('active'));
      document.querySelectorAll('.panel').forEach(p => p.classList.remove('active'));
      btn.classList.add('active');
      document.getElementById('panel-' + btn.dataset.panel).classList.add('active');
    });
  });

  document.getElementById('signout-btn').addEventListener('click', async () => {
    await supabaseClient.auth.signOut();
    window.location.href = 'index.html';
  });

  async function guardAdmin() {
    const { data: { session } } = await supabaseClient.auth.getSession();
    if (!session) { window.location.href = 'admin-login.html'; return false; }
    const { data: profile } = await supabaseClient.from('profiles').select('is_admin').eq('id', session.user.id).single();
    if (!profile || !profile.is_admin) { window.location.href = 'admin-login.html'; return false; }
    return true;
  }

  async function loadOrders() {
    const { data: orders, error } = await supabaseClient
      .from('orders')
      .select('*, order_items(product_name, quantity), addresses(full_address, city, governorate, phone), profiles(email, full_name, phone)')
      .order('created_at', { ascending: false });

    if (error) { console.error(error); return []; }

    const tbody = document.getElementById('orders-tbody');
    if (!orders.length) {
      tbody.innerHTML = '<tr><td colspan="8" class="empty-note">No orders yet.</td></tr>';
      return orders;
    }

    tbody.innerHTML = orders.map(o => `
      <tr data-order-id="${o.id}">
        <td>${new Date(o.created_at).toLocaleDateString()}</td>
        <td>${o.profiles ? (o.profiles.full_name || o.profiles.phone || o.profiles.email || '—') : '—'}</td>
        <td>${o.addresses ? `${o.addresses.full_address}, ${o.addresses.city || ''}<br>${o.addresses.phone || ''}` : '—'}</td>
        <td>${o.order_items.map(i => `${i.product_name} ×${i.quantity}`).join('<br>')}</td>
        <td>${Number(o.total).toFixed(0)} EGP</td>
        <td><span class="badge ${o.payment_status === 'paid' ? 'paid' : 'unpaid'}">${o.payment_status}</span> (${o.payment_method})</td>
        <td>
          <select class="status-select" data-order-id="${o.id}">
            ${['pending','processing','shipped','delivered','cancelled'].map(s => `<option value="${s}" ${o.status === s ? 'selected' : ''}>${s}</option>`).join('')}
          </select>
        </td>
        <td>
          ${o.payment_status !== 'paid' ? `<button class="mark-paid-btn" data-order-id="${o.id}">Mark Paid</button>` : ''}
        </td>
      </tr>
    `).join('');

    return orders;
  }

  async function loadCustomers() {
    const { data, error } = await supabaseClient
      .from('profiles')
      .select('email, full_name, phone, created_at')
      .order('created_at', { ascending: false });

    if (error) { console.error(error); return; }

    const tbody = document.getElementById('customers-tbody');
    tbody.innerHTML = data.length
      ? data.map(c => `
          <tr>
            <td>${c.email || '—'}</td>
            <td>${c.full_name || '—'}</td>
            <td>${c.phone || '—'}</td>
            <td>${new Date(c.created_at).toLocaleDateString()}</td>
          </tr>
        `).join('')
      : '<tr><td colspan="4" class="empty-note">No customers yet.</td></tr>';
  }

  let categoriesCache = [];

  async function loadCategoriesForSelect() {
    const { data, error } = await supabaseClient.from('categories').select('id, name').order('name');
    if (error) { console.error(error); return; }
    categoriesCache = data;
    document.getElementById('new-category').innerHTML = data.map(c => `<option value="${c.id}">${c.name}</option>`).join('');
  }

  function slugify(text) {
    return text.toLowerCase().trim().replace(/[^a-z0-9]+/g, '-').replace(/(^-|-$)/g, '') + '-' + Date.now().toString(36);
  }

  async function uploadProductImage(file) {
    const path = `${Date.now()}-${file.name.replace(/[^a-zA-Z0-9.\-]/g, '_')}`;
    const { error } = await supabaseClient.storage.from('product-images').upload(path, file);
    if (error) throw error;
    const { data } = supabaseClient.storage.from('product-images').getPublicUrl(path);
    return data.publicUrl;
  }

  async function loadInventory() {
    const { data, error } = await supabaseClient
      .from('products')
      .select('id, name, name_ar, price, stock_quantity, image_url, categories(name)')
      .order('name');

    if (error) { console.error(error); return []; }

    const tbody = document.getElementById('inventory-tbody');
    tbody.innerHTML = data.length
      ? data.map(p => `
          <tr data-product-id="${p.id}">
            <td>
              ${p.image_url ? `<img src="${p.image_url}" style="width:44px;height:44px;object-fit:cover;border-radius:8px;">` : '🧸'}
              <br><input type="file" accept="image/*" class="product-image-input" data-product-id="${p.id}" style="width:90px; font-size:10px; margin-top:4px;">
            </td>
            <td><input type="text" class="name-input" data-product-id="${p.id}" value="${p.name}" style="width:140px; padding:5px 7px; border-radius:6px; border:1px solid var(--line); font-family:inherit; font-size:12px;"></td>
            <td>${p.categories ? p.categories.name : '—'}</td>
            <td><input type="number" class="price-input" data-product-id="${p.id}" value="${p.price}" min="0" step="0.01" style="width:70px; padding:5px 7px; border-radius:6px; border:1px solid var(--line); font-family:inherit; font-size:12px;"></td>
            <td class="${p.stock_quantity <= LOW_STOCK_THRESHOLD ? 'low-stock' : ''}">
              <input type="number" class="stock-input" data-product-id="${p.id}" value="${p.stock_quantity}" min="0" style="width:70px;">
            </td>
            <td><button class="mark-paid-btn save-stock-btn" data-product-id="${p.id}">Save</button></td>
          </tr>
        `).join('')
      : '<tr><td colspan="6" class="empty-note">No products yet.</td></tr>';

    return data;
  }

  document.getElementById('toggle-add-product').addEventListener('click', () => {
    const form = document.getElementById('add-product-form');
    form.style.display = form.style.display === 'none' ? 'block' : 'none';
  });

  document.getElementById('add-product-form').addEventListener('submit', async (e) => {
    e.preventDefault();
    const msg = document.getElementById('add-product-msg');
    msg.textContent = '';

    const name = document.getElementById('new-name').value.trim();
    const nameAr = document.getElementById('new-name-ar').value.trim();
    const categoryId = document.getElementById('new-category').value;
    const price = Number(document.getElementById('new-price').value);
    const stock = Number(document.getElementById('new-stock').value);
    const badge = document.getElementById('new-badge').value.trim();
    const imageFile = document.getElementById('new-image').files[0];

    try {
      let imageUrl = null;
      if (imageFile) imageUrl = await uploadProductImage(imageFile);

      const { error } = await supabaseClient.from('products').insert({
        name, name_ar: nameAr || null, category_id: categoryId,
        price, stock_quantity: stock, badge: badge || null,
        image_url: imageUrl, slug: slugify(name)
      });
      if (error) throw error;

      document.getElementById('add-product-form').reset();
      document.getElementById('add-product-form').style.display = 'none';
      await refresh();
    } catch (err) {
      msg.textContent = err.message;
    }
  });

  document.getElementById('inventory-tbody').addEventListener('change', async (e) => {
    if (!e.target.classList.contains('product-image-input')) return;
    const productId = e.target.dataset.productId;
    const file = e.target.files[0];
    if (!file) return;
    try {
      const imageUrl = await uploadProductImage(file);
      const { error } = await supabaseClient.from('products').update({ image_url: imageUrl }).eq('id', productId);
      if (error) throw error;
      await refresh();
    } catch (err) {
      alert(err.message);
    }
  });

  function renderStats(orders, products) {
    document.getElementById('stat-orders').textContent = orders.length;
    document.getElementById('stat-revenue').textContent = orders
      .filter(o => o.payment_status === 'paid')
      .reduce((sum, o) => sum + Number(o.total), 0)
      .toFixed(0) + ' EGP';
    document.getElementById('stat-pending').textContent = orders.filter(o => o.status === 'pending').length;
    document.getElementById('stat-lowstock').textContent = products.filter(p => p.stock_quantity <= LOW_STOCK_THRESHOLD).length;
  }

  document.getElementById('orders-tbody').addEventListener('change', async (e) => {
    if (!e.target.classList.contains('status-select')) return;
    const orderId = e.target.dataset.orderId;
    const { error } = await supabaseClient.from('orders').update({ status: e.target.value }).eq('id', orderId);
    if (error) alert(error.message);
  });

  document.getElementById('orders-tbody').addEventListener('click', async (e) => {
    if (!e.target.classList.contains('mark-paid-btn')) return;
    const orderId = e.target.dataset.orderId;
    const { error } = await supabaseClient.from('orders').update({ payment_status: 'paid' }).eq('id', orderId);
    if (error) { alert(error.message); return; }
    await refresh();
  });

  document.getElementById('inventory-tbody').addEventListener('click', async (e) => {
    if (!e.target.classList.contains('save-stock-btn')) return;
    const productId = e.target.dataset.productId;
    const stockInput = document.querySelector(`.stock-input[data-product-id="${productId}"]`);
    const nameInput = document.querySelector(`.name-input[data-product-id="${productId}"]`);
    const priceInput = document.querySelector(`.price-input[data-product-id="${productId}"]`);
    const { error } = await supabaseClient.from('products').update({
      stock_quantity: Number(stockInput.value),
      name: nameInput.value.trim(),
      price: Number(priceInput.value)
    }).eq('id', productId);
    if (error) { alert(error.message); return; }
    await refresh();
  });

  async function refresh() {
    const orders = await loadOrders();
    await loadCustomers();
    await loadCategoriesForSelect();
    const products = await loadInventory();
    renderStats(orders, products);
  }

  (async () => {
    if (await guardAdmin()) refresh();
  })();
</script>
</body>
</html>
