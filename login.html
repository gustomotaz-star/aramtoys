<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Sign In — Aram Toys</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Baloo+2:wght@600;700;800&family=Nunito+Sans:wght@400;600;700;800&family=Baloo+Bhaijaan+2:wght@600;700;800&family=Tajawal:wght@400;500;700;800&display=swap" rel="stylesheet">
<link rel="stylesheet" href="assets/css/rtl.css">
<style>
  :root{
    --cream:#FBF6EC;
    --ink:#2B2A4C;
    --coral:#FF6B5B;
    --mustard:#FFC145;
    --mint:#4ECDC4;
    --paper:#FFFFFF;
    --line: rgba(43,42,76,0.12);
  }
  *{box-sizing:border-box; margin:0; padding:0;}
  body{
    background:var(--cream);
    color:var(--ink);
    font-family:'Nunito Sans', sans-serif;
    min-height:100vh;
    display:flex; align-items:center; justify-content:center;
    padding:24px;
  }
  a{color:inherit;}
  .block-logo{ display:flex; gap:4px; justify-content:center; margin-bottom:24px; }
  .block-logo .tile{
    width:34px; height:34px; border-radius:8px;
    display:flex; align-items:center; justify-content:center;
    font-family:'Baloo 2', sans-serif; font-weight:800; font-size:18px; color:var(--paper);
  }
  .block-logo .tile:nth-child(1){background:var(--coral);}
  .block-logo .tile:nth-child(2){background:var(--mustard); color:var(--ink);}
  .block-logo .tile:nth-child(3){background:var(--mint);}
  .block-logo .tile:nth-child(4){background:var(--ink);}

  .card{
    background:var(--paper);
    border:1px solid var(--line);
    border-radius:22px;
    padding:40px 36px;
    width:100%; max-width:400px;
  }
  h1{ font-family:'Baloo 2', sans-serif; font-size:24px; text-align:center; margin-bottom:6px; }
  .sub{ text-align:center; color:rgba(43,42,76,0.6); font-size:14px; margin-bottom:28px; }

  .tabs{ display:flex; gap:8px; background:var(--cream); border-radius:12px; padding:4px; margin-bottom:24px; }
  .tab{ flex:1; text-align:center; padding:10px; border-radius:9px; font-weight:700; font-size:14px; cursor:pointer; border:none; background:transparent; font-family:inherit; color:var(--ink); }
  .tab.active{ background:var(--ink); color:var(--cream); }

  label{ display:block; font-size:13px; font-weight:700; margin-bottom:6px; margin-top:16px; }
  input{
    width:100%; padding:12px 14px; border-radius:12px;
    border:2px solid var(--line); font-family:inherit; font-size:15px;
  }
  input:focus{ outline:none; border-color:var(--mint); }

  .submit-btn{
    width:100%; margin-top:24px; padding:14px; border-radius:14px;
    background:var(--ink); color:var(--cream); font-weight:800; font-size:15px;
    border:none; cursor:pointer;
  }
  .submit-btn:disabled{ opacity:0.6; cursor:default; }

  .msg{ margin-top:16px; font-size:13px; text-align:center; }
  .msg.error{ color:var(--coral); }
  .msg.success{ color:#1a8f5c; }

  .back{ display:block; text-align:center; margin-top:20px; font-size:13px; color:rgba(43,42,76,0.6); text-decoration:none; }
</style>
</head>
<body>

<div>
  <a href="index.html" class="block-logo" aria-label="Aram Toys">
    <span class="tile">A</span><span class="tile">R</span><span class="tile">A</span><span class="tile">M</span>
  </a>
  <div style="text-align:center; margin-bottom:16px;">
    <button class="lang-toggle" aria-label="Change language">English</button>
  </div>
  <div class="card">
    <h1 data-i18n="login_title">Welcome to Aram Toys</h1>
    <p class="sub" data-i18n="login_sub">Sign in to track orders and save your addresses</p>

    <div class="tabs">
      <button class="tab active" data-mode="login" type="button" data-i18n="login_tab_signin">Sign In</button>
      <button class="tab" data-mode="signup" type="button" data-i18n="login_tab_signup">Create Account</button>
    </div>

    <form id="auth-form">
      <div id="method-toggle" style="display:none;">
        <label data-i18n="login_signup_with">Sign up with</label>
        <div class="tabs" style="margin-bottom:0;">
          <button type="button" class="tab method-btn active" data-method="email" data-i18n="login_method_email">Email</button>
          <button type="button" class="tab method-btn" data-method="phone" data-i18n="login_method_phone">Phone</button>
        </div>
      </div>

      <label for="identifier" id="identifier-label" data-i18n="login_identifier">Email or Phone</label>
      <input type="text" id="identifier" required autocomplete="username">

      <label for="password" data-i18n="login_password">Password</label>
      <input type="password" id="password" required minlength="6" autocomplete="current-password">

      <div id="confirm-password-wrap" style="display:none;">
        <label for="confirm-password" data-i18n="login_confirm_password">Confirm Password</label>
        <input type="password" id="confirm-password" autocomplete="new-password">
      </div>

      <button type="submit" class="submit-btn" id="submit-btn" data-i18n="login_tab_signin">Sign In</button>
      <p class="msg" id="msg"></p>
    </form>

    <a href="index.html" class="back" data-i18n="login_back">← Back to shop</a>
  </div>
  <div style="text-align:center; margin-top:16px;">
    <button class="lang-toggle" aria-label="Change language">English</button>
  </div>
</div>

<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2/dist/umd/supabase.js"></script>
<script src="assets/js/supabase-client.js"></script>
<script src="assets/js/i18n.js"></script>
<script src="assets/js/cart.js"></script>
<script>
  let mode = 'login';
  let signupMethod = 'email';
  const modeTabs = document.querySelectorAll('.tab[data-mode]');
  const methodBtns = document.querySelectorAll('.method-btn');
  const form = document.getElementById('auth-form');
  const submitBtn = document.getElementById('submit-btn');
  const msg = document.getElementById('msg');
  const identifierInput = document.getElementById('identifier');
  const identifierLabel = document.getElementById('identifier-label');
  const methodToggle = document.getElementById('method-toggle');
  const confirmPasswordWrap = document.getElementById('confirm-password-wrap');

  function updateFormForMode() {
    submitBtn.textContent = mode === 'login' ? t('login_tab_signin') : t('login_tab_signup');
    methodToggle.style.display = mode === 'signup' ? 'block' : 'none';
    confirmPasswordWrap.style.display = mode === 'signup' ? 'block' : 'none';
    document.getElementById('confirm-password').required = mode === 'signup';

    if (mode === 'login') {
      identifierLabel.textContent = t('login_identifier');
      identifierInput.type = 'text';
      identifierInput.autocomplete = 'username';
    } else {
      updateIdentifierForMethod();
    }
  }

  function updateIdentifierForMethod() {
    if (signupMethod === 'email') {
      identifierLabel.textContent = t('login_method_email');
      identifierInput.type = 'email';
      identifierInput.autocomplete = 'email';
      identifierInput.placeholder = '';
    } else {
      identifierLabel.textContent = t('login_method_phone');
      identifierInput.type = 'tel';
      identifierInput.autocomplete = 'tel';
      identifierInput.placeholder = '+201001234567';
    }
  }

  modeTabs.forEach(tab => {
    tab.addEventListener('click', () => {
      modeTabs.forEach(t => t.classList.remove('active'));
      tab.classList.add('active');
      mode = tab.dataset.mode;
      msg.textContent = '';
      updateFormForMode();
    });
  });

  methodBtns.forEach(btn => {
    btn.addEventListener('click', () => {
      methodBtns.forEach(b => b.classList.remove('active'));
      btn.classList.add('active');
      signupMethod = btn.dataset.method;
      updateIdentifierForMethod();
    });
  });

  document.addEventListener('langchange', updateFormForMode);
  updateFormForMode();

  const PHONE_EMAIL_DOMAIN = 'phone.aramtoys.local';
  function phoneToSyntheticEmail(phone) {
    return phone.replace(/\D/g, '') + '@' + PHONE_EMAIL_DOMAIN;
  }

  async function redirectIfLoggedIn() {
    const { data } = await supabaseClient.auth.getSession();
    if (data.session) window.location.href = 'index.html';
  }
  redirectIfLoggedIn();

  form.addEventListener('submit', async (e) => {
    e.preventDefault();
    const identifier = identifierInput.value.trim();
    const password = document.getElementById('password').value;

    submitBtn.disabled = true;
    msg.textContent = '';
    msg.className = 'msg';

    if (mode === 'login') {
      const email = identifier.includes('@') ? identifier : phoneToSyntheticEmail(identifier);
      const { error } = await supabaseClient.auth.signInWithPassword({ email, password });
      if (error) {
        msg.textContent = error.message;
        msg.classList.add('error');
        submitBtn.disabled = false;
      } else {
        clearCart();
        window.location.href = 'index.html';
      }
    } else {
      const confirmPassword = document.getElementById('confirm-password').value;
      if (password !== confirmPassword) {
        msg.textContent = t('login_password_mismatch');
        msg.classList.add('error');
        submitBtn.disabled = false;
        return;
      }

      const email = signupMethod === 'email' ? identifier : phoneToSyntheticEmail(identifier);
      const { data, error } = await supabaseClient.auth.signUp({ email, password });

      if (error) {
        msg.textContent = error.message;
        msg.classList.add('error');
        submitBtn.disabled = false;
      } else if (data.session) {
        if (signupMethod === 'phone') {
          await supabaseClient.from('profiles').update({ phone: identifier, email: null }).eq('id', data.user.id);
        }
        clearCart();
        window.location.href = 'index.html';
      } else {
        msg.textContent = t('login_confirm_msg');
        msg.classList.add('success');
        submitBtn.disabled = false;
      }
    }
  });
</script>
</body>
</html>
