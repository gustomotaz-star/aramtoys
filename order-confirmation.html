<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Order Confirmed — Aram Toys</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Baloo+2:wght@600;700;800&family=Nunito+Sans:wght@400;600;700;800&family=Space+Mono:wght@700&family=Baloo+Bhaijaan+2:wght@600;700;800&family=Tajawal:wght@400;500;700;800&display=swap" rel="stylesheet">
<link rel="stylesheet" href="assets/css/rtl.css">
<style>
  :root{
    --cream:#FBF6EC; --ink:#2B2A4C; --coral:#FF6B5B; --mustard:#FFC145; --mint:#4ECDC4;
    --paper:#FFFFFF; --line: rgba(43,42,76,0.12);
  }
  *{box-sizing:border-box; margin:0; padding:0;}
  body{ background:var(--cream); color:var(--ink); font-family:'Nunito Sans', sans-serif; }
  a{color:inherit; text-decoration:none;}
  .wrap{ max-width:560px; margin:0 auto; padding:60px 24px; text-align:center; }
  .block-logo{ display:flex; gap:4px; justify-content:center; margin-bottom:28px; }
  .block-logo .tile{
    width:30px; height:30px; border-radius:7px;
    display:flex; align-items:center; justify-content:center;
    font-family:'Baloo 2', sans-serif; font-weight:800; font-size:15px; color:var(--paper);
  }
  .block-logo .tile:nth-child(1){background:var(--coral);}
  .block-logo .tile:nth-child(2){background:var(--mustard); color:var(--ink);}
  .block-logo .tile:nth-child(3){background:var(--mint);}
  .block-logo .tile:nth-child(4){background:var(--ink);}

  .check{ font-size:52px; margin-bottom:16px; }
  h1{ font-family:'Baloo 2', sans-serif; font-size:26px; margin-bottom:8px; }
  .sub{ color:rgba(43,42,76,0.6); margin-bottom:32px; font-size:14px; }

  .card{ background:var(--paper); border:1px solid var(--line); border-radius:18px; padding:24px; text-align:left; margin-bottom:24px; }
  .row{ display:flex; justify-content:space-between; padding:8px 0; border-bottom:1px solid var(--line); font-size:14px; }
  .row:last-child{ border-bottom:none; }
  .row span:first-child{ color:rgba(43,42,76,0.6); }

  .home-btn{
    display:inline-block; padding:14px 28px; background:var(--ink); color:var(--cream);
    border-radius:14px; font-weight:800; font-size:15px;
  }
</style>
</head>
<body>
<div class="wrap">
  <a href="index.html" class="block-logo" aria-label="Aram Toys">
    <span class="tile">A</span><span class="tile">R</span><span class="tile">A</span><span class="tile">M</span>
  </a>
  <div class="check">🎉</div>
  <h1 data-i18n="confirm_title">Thank you! Your order is in.</h1>
  <p class="sub" id="order-id-line" data-i18n="confirm_loading">Loading order details...</p>

  <div class="card" id="order-details"></div>

  <a href="index.html" class="home-btn" data-i18n="confirm_continue">Continue Shopping</a>

  <div style="margin-top:20px;">
    <button class="lang-toggle" aria-label="Change language">English</button>
  </div>
</div>

<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2/dist/umd/supabase.js"></script>
<script src="assets/js/supabase-client.js"></script>
<script src="assets/js/i18n.js"></script>
<script>
  async function init() {
    const orderId = new URLSearchParams(window.location.search).get('order');
    if (!orderId) { window.location.href = 'index.html'; return; }

    const { data: order, error } = await supabaseClient
      .from('orders')
      .select('*, order_items(*), addresses(full_address, city, governorate)')
      .eq('id', orderId)
      .single();

    if (error || !order) {
      document.getElementById('order-id-line').textContent = 'Could not find this order.';
      return;
    }

    document.getElementById('order-id-line').textContent = `Order #${order.id.slice(0, 8).toUpperCase()}`;

    document.getElementById('order-details').innerHTML = `
      ${order.order_items.map(i => `<div class="row"><span>${i.product_name} × ${i.quantity}</span><span>${Number(i.line_total).toFixed(0)} EGP</span></div>`).join('')}
      <div class="row"><span>${t('confirm_shipping')}</span><span>${Number(order.shipping_fee) === 0 ? t('cart_free') : Number(order.shipping_fee).toFixed(0) + ' EGP'}</span></div>
      <div class="row"><span>${t('confirm_total')}</span><span>${Number(order.total).toFixed(0)} EGP</span></div>
      <div class="row"><span>${t('confirm_payment')}</span><span>${order.payment_method === 'cash' ? t('checkout_cash') : order.payment_method}</span></div>
      <div class="row"><span>${t('confirm_deliver')}</span><span>${order.addresses.full_address}, ${order.addresses.city || ''}</span></div>
    `;
  }
  init();
</script>
</body>
</html>
