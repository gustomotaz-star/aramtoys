<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Category — Aram Toys</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Baloo+2:wght@500;600;700;800&family=Nunito+Sans:wght@400;600;700;800&family=Space+Mono:wght@400;700&family=Baloo+Bhaijaan+2:wght@500;600;700;800&family=Tajawal:wght@400;500;700;800&display=swap" rel="stylesheet">
<link rel="stylesheet" href="assets/css/rtl.css">
<style>
  :root{
    --cream:#FBF6EC; --ink:#2B2A4C; --coral:#FF6B5B; --mustard:#FFC145; --mint:#4ECDC4;
    --paper:#FFFFFF; --line: rgba(43,42,76,0.12);
  }
  *{box-sizing:border-box; margin:0; padding:0;}
  body{ background:var(--cream); color:var(--ink); font-family:'Nunito Sans', sans-serif; line-height:1.5; }
  a{color:inherit; text-decoration:none;}
  img{max-width:100%; display:block;}
  button{font-family:inherit; cursor:pointer; border:none;}
  .wrap{ max-width:1180px; margin:0 auto; padding:0 32px; }

  h1,h2,h3{ font-family:'Baloo 2', sans-serif; font-weight:700; line-height:1.05; }

  /* Header (same as homepage) */
  header{ position:sticky; top:0; z-index:50; background:rgba(251,246,236,0.9); backdrop-filter:blur(8px); border-bottom:1px solid var(--line); }
  .nav{ display:flex; align-items:center; justify-content:space-between; padding:18px 0; }
  .block-logo{ display:inline-flex; gap:4px; }
  .block-logo .tile{
    width:34px; height:34px; border-radius:8px;
    display:flex; align-items:center; justify-content:center;
    font-family:'Baloo 2', sans-serif; font-weight:800; font-size:18px; color:var(--paper);
    box-shadow:0 3px 0 rgba(43,42,76,0.25);
  }
  .block-logo .tile:nth-child(1){background:var(--coral);}
  .block-logo .tile:nth-child(2){background:var(--mustard); color:var(--ink); box-shadow:0 3px 0 rgba(43,42,76,0.2);}
  .block-logo .tile:nth-child(3){background:var(--mint);}
  .block-logo .tile:nth-child(4){background:var(--ink);}
  .nav-actions{ display:flex; align-items:center; gap:18px; }
  .icon-btn{
    width:40px; height:40px; border-radius:12px; background:var(--paper); border:1px solid var(--line);
    display:flex; align-items:center; justify-content:center; font-size:18px; position:relative;
  }
  .cart-badge{
    display:none; position:absolute; top:-4px; right:-4px;
    background:var(--coral); color:#fff; font-size:10px; font-weight:800;
    min-width:16px; height:16px; border-radius:8px; align-items:center; justify-content:center; padding:0 4px;
  }

  /* Category header */
  .cat-hero{ padding:50px 0 30px; }
  .cat-hero .back{ font-weight:700; font-size:14px; color:rgba(43,42,76,0.6); margin-bottom:20px; display:inline-block; }
  .cat-hero-row{ display:flex; align-items:center; gap:18px; }
  .cat-hero-icon{
    width:64px; height:64px; border-radius:18px; background:var(--paper); border:1px solid var(--line);
    display:flex; align-items:center; justify-content:center; font-size:32px;
  }
  .cat-hero h1{ font-size:clamp(26px,4vw,36px); }
  .cat-count{ color:rgba(43,42,76,0.55); font-size:14px; font-weight:700; }

  .section{ padding:20px 0 70px; }

  /* Product grid (independent from homepage's .prod-grid so catalog.js's auto-loader doesn't touch it) */
  .cat-prod-grid{ display:grid; grid-template-columns:repeat(4,1fr); gap:22px; }
  .prod-card{
    background:var(--paper); border:1px solid var(--line); border-radius:22px; overflow:hidden;
    transition:transform .2s cubic-bezier(.34,1.56,.64,1), box-shadow .2s; display:flex; flex-direction:column;
  }
  .prod-card:hover{ transform:translateY(-6px); box-shadow:0 18px 30px -16px rgba(43,42,76,0.3); }
  .prod-thumb{ height:170px; display:flex; align-items:center; justify-content:center; font-size:56px; position:relative; overflow:hidden; background:linear-gradient(135deg,#FFE3DE,#FFF1CE); }
  .prod-thumb img{ width:100%; height:100%; object-fit:cover; }
  .prod-badge{
    position:absolute; top:12px; left:12px; background:var(--ink); color:var(--cream);
    font-family:'Space Mono',monospace; font-size:11px; font-weight:700; padding:4px 10px; border-radius:100px;
  }
  .prod-body{ padding:18px 18px 20px; display:flex; flex-direction:column; gap:10px; flex:1; }
  .prod-cat{ font-size:12px; text-transform:uppercase; letter-spacing:0.05em; color:rgba(43,42,76,0.5); font-weight:700; }
  .prod-name{ font-family:'Baloo 2',sans-serif; font-weight:700; font-size:18px; }
  .prod-row{ display:flex; align-items:center; justify-content:space-between; margin-top:auto; }
  .prod-price{ font-family:'Space Mono',monospace; font-weight:700; font-size:17px; }
  .add-btn{
    width:38px; height:38px; border-radius:12px; background:var(--ink); color:var(--cream); font-size:20px;
    display:flex; align-items:center; justify-content:center; transition:transform .15s cubic-bezier(.34,1.56,.64,1), background .15s;
  }
  .add-btn:hover{ background:var(--coral); transform:scale(1.08) rotate(90deg); }

  @media (max-width:980px){ .cat-prod-grid{ grid-template-columns:repeat(2,1fr);} }
  @media (max-width:560px){ .cat-prod-grid{ grid-template-columns:1fr;} }

  .empty-note{ color:rgba(43,42,76,0.55); font-size:14px; padding:40px 0; }

  /* Footer (simplified) */
  footer{ border-top:1px solid var(--line); padding:40px 0; text-align:center; }
  .foot-bottom{ display:flex; justify-content:center; align-items:center; gap:16px; font-size:13px; color:rgba(43,42,76,0.55); flex-wrap:wrap; }

  :focus-visible{ outline:3px solid var(--coral); outline-offset:2px; }
</style>
</head>
<body>

<header>
  <div class="wrap nav">
    <a href="index.html" class="block-logo" aria-label="Aram Toys">
      <span class="tile">A</span><span class="tile">R</span><span class="tile">A</span><span class="tile">M</span>
    </a>
    <div class="nav-actions">
      <button class="lang-toggle" aria-label="Change language">English</button>
      <a href="login.html" class="icon-btn" aria-label="Account">👤</a>
      <a href="cart.html" class="icon-btn cart-icon" aria-label="Cart">
        🧺
        <span id="cart-badge" class="cart-badge">0</span>
      </a>
    </div>
  </div>
</header>

<main>
  <section class="cat-hero wrap">
    <a href="index.html#categories" class="back" data-i18n="cart_continue">← Continue Shopping</a>
    <div class="cat-hero-row">
      <div class="cat-hero-icon" id="cat-icon">🧸</div>
      <div>
        <h1 id="cat-name">Category</h1>
        <span class="cat-count" id="cat-count"></span>
      </div>
    </div>
  </section>

  <section class="section wrap">
    <div class="cat-prod-grid" id="cat-prod-grid"></div>
    <p class="empty-note" id="empty-note" style="display:none;"></p>
  </section>
</main>

<footer>
  <div class="wrap foot-bottom">
    <span data-i18n="foot_rights">© 2026 Aram Toys. All rights reserved.</span>
    <button class="lang-toggle" aria-label="Change language">English</button>
  </div>
</footer>

<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2/dist/umd/supabase.js"></script>
<script src="assets/js/supabase-client.js"></script>
<script src="assets/js/i18n.js"></script>
<script src="assets/js/cart.js"></script>
<script src="assets/js/catalog.js"></script>
<script>
  const slug = new URLSearchParams(window.location.search).get('slug');
  let categoryData = null;
  let productsData = [];

  async function loadCategoryPage() {
    if (!slug) { window.location.href = 'index.html'; return; }

    const { data: category, error: catError } = await supabaseClient
      .from('categories')
      .select('*')
      .eq('slug', slug)
      .single();

    if (catError || !category) {
      document.getElementById('cat-name').textContent = 'Category not found';
      return;
    }
    categoryData = category;

    const { data: products, error: prodError } = await supabaseClient
      .from('products')
      .select('*, categories(name, name_ar)')
      .eq('category_id', category.id)
      .eq('is_active', true)
      .order('created_at', { ascending: false });

    if (prodError) { console.error(prodError); return; }
    productsData = products;

    renderCategoryPage();
  }

  function renderCategoryPage() {
    if (!categoryData) return;
    document.getElementById('cat-icon').textContent = categoryData.icon || '🧸';
    document.getElementById('cat-name').textContent = localized(categoryData, 'name');
    document.title = `${localized(categoryData, 'name')} — Aram Toys`;

    const grid = document.getElementById('cat-prod-grid');
    const emptyNote = document.getElementById('empty-note');
    const countEl = document.getElementById('cat-count');

    countEl.textContent = getLang() === 'ar'
      ? `${productsData.length} منتج`
      : `${productsData.length} ${productsData.length === 1 ? 'toy' : 'toys'}`;

    if (!productsData.length) {
      grid.innerHTML = '';
      emptyNote.style.display = 'block';
      emptyNote.textContent = getLang() === 'ar' ? 'لا يوجد منتجات في هذا التصنيف حالياً.' : 'No products in this category yet.';
      return;
    }
    emptyNote.style.display = 'none';
    grid.innerHTML = productsData.map(productCardHtml).join('');
  }

  document.addEventListener('langchange', renderCategoryPage);

  loadCategoryPage();
</script>
</body>
</html>
