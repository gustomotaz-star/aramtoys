<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>إعادة تعيين كلمة المرور — Aram Toys</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Baloo+2:wght@600;700;800&family=Tajawal:wght@400;500;700;800&display=swap" rel="stylesheet">
<style>
  :root{
    --cream:#FBF6EC;
    --ink:#2B2A4C;
    --coral:#FF6B5B;
    --mustard:#FFC145;
    --mint:#4ECDC4;
    --paper:#FFFFFF;
    --line:rgba(43,42,76,.12);
  }
  *{box-sizing:border-box;margin:0;padding:0}
  body{
    min-height:100vh;
    display:flex;
    align-items:center;
    justify-content:center;
    padding:24px;
    background:var(--cream);
    color:var(--ink);
    font-family:'Tajawal',sans-serif;
  }
  .wrap{width:100%;max-width:420px}
  .block-logo{display:flex;gap:4px;justify-content:center;margin-bottom:24px;text-decoration:none}
  .tile{
    width:36px;height:36px;border-radius:9px;
    display:flex;align-items:center;justify-content:center;
    font-family:'Baloo 2',sans-serif;font-weight:800;font-size:19px;color:#fff;
  }
  .tile:nth-child(1){background:var(--coral)}
  .tile:nth-child(2){background:var(--mustard);color:var(--ink)}
  .tile:nth-child(3){background:var(--mint)}
  .tile:nth-child(4){background:var(--ink)}
  .card{
    background:var(--paper);
    border:1px solid var(--line);
    border-radius:22px;
    padding:36px 30px;
    box-shadow:0 18px 45px rgba(43,42,76,.08);
  }
  h1{font-size:25px;text-align:center;margin-bottom:8px;font-weight:800}
  .sub{text-align:center;color:rgba(43,42,76,.65);font-size:14px;line-height:1.7;margin-bottom:26px}
  label{display:block;font-size:14px;font-weight:700;margin:16px 0 7px}
  input{
    width:100%;padding:13px 14px;border-radius:12px;
    border:2px solid var(--line);font-family:inherit;font-size:16px;
  }
  input:focus{outline:none;border-color:var(--mint)}
  button{
    width:100%;margin-top:24px;padding:14px;border-radius:14px;
    border:none;background:var(--ink);color:var(--cream);
    font-family:inherit;font-size:15px;font-weight:800;cursor:pointer;
  }
  button:disabled{opacity:.55;cursor:default}
  .msg{margin-top:16px;text-align:center;font-size:14px;line-height:1.6}
  .msg.error{color:var(--coral)}
  .msg.success{color:#198754}
  .back{display:block;text-align:center;margin-top:18px;color:rgba(43,42,76,.6);font-size:13px;text-decoration:none}
  .hidden{display:none}
</style>
</head>
<body>
<div class="wrap">
  <a href="index.html" class="block-logo" aria-label="Aram Toys">
    <span class="tile">A</span><span class="tile">R</span><span class="tile">A</span><span class="tile">M</span>
  </a>

  <div class="card">
    <h1>إعادة تعيين كلمة المرور</h1>
    <p class="sub" id="sub">افتح هذه الصفحة من رابط الاستعادة المرسل إلى بريدك، ثم اختر كلمة مرور جديدة.</p>

    <form id="reset-form" class="hidden">
      <label for="password">كلمة المرور الجديدة</label>
      <input id="password" type="password" minlength="6" required autocomplete="new-password">

      <label for="confirm-password">تأكيد كلمة المرور</label>
      <input id="confirm-password" type="password" minlength="6" required autocomplete="new-password">

      <button id="submit-btn" type="submit">حفظ كلمة المرور الجديدة</button>
    </form>

    <p class="msg" id="msg">جاري التحقق من رابط الاستعادة...</p>
    <a href="login.html" class="back">العودة إلى تسجيل الدخول</a>
  </div>
</div>

<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2/dist/umd/supabase.js"></script>
<script src="assets/js/supabase-client.js"></script>
<script>
  const form = document.getElementById('reset-form');
  const submitBtn = document.getElementById('submit-btn');
  const msg = document.getElementById('msg');
  const sub = document.getElementById('sub');

  function showError(text) {
    msg.textContent = text;
    msg.className = 'msg error';
    form.classList.add('hidden');
  }

  function showReady() {
    msg.textContent = '';
    msg.className = 'msg';
    form.classList.remove('hidden');
  }

  async function establishRecoverySession() {
    try {
      const hash = new URLSearchParams(window.location.hash.slice(1));
      const accessToken = hash.get('access_token');
      const refreshToken = hash.get('refresh_token');
      const type = hash.get('type');

      if (accessToken && refreshToken) {
        if (type && type !== 'recovery') {
          showError('هذا الرابط ليس رابط استعادة كلمة مرور صالحًا.');
          return;
        }

        const { error } = await supabaseClient.auth.setSession({
          access_token: accessToken,
          refresh_token: refreshToken
        });

        if (error) {
          showError('تعذر التحقق من رابط الاستعادة أو انتهت صلاحيته. اطلب رابطًا جديدًا.');
          return;
        }

        history.replaceState(null, document.title, window.location.pathname + window.location.search);
      }

      const { data, error } = await supabaseClient.auth.getSession();
      if (error || !data.session) {
        showError('رابط الاستعادة غير صالح أو انتهت صلاحيته. اطلب رابط استعادة جديدًا.');
        return;
      }

      showReady();
    } catch (e) {
      showError('حدث خطأ أثناء فتح رابط الاستعادة. حاول مرة أخرى.');
    }
  }

  form.addEventListener('submit', async (e) => {
    e.preventDefault();

    const password = document.getElementById('password').value;
    const confirmPassword = document.getElementById('confirm-password').value;

    msg.textContent = '';
    msg.className = 'msg';

    if (password.length < 6) {
      showError('كلمة المرور يجب أن تكون 6 أحرف على الأقل.');
      form.classList.remove('hidden');
      return;
    }

    if (password !== confirmPassword) {
      msg.textContent = 'كلمتا المرور غير متطابقتين.';
      msg.className = 'msg error';
      return;
    }

    submitBtn.disabled = true;
    submitBtn.textContent = 'جاري الحفظ...';

    const { error } = await supabaseClient.auth.updateUser({ password });

    if (error) {
      msg.textContent = error.message || 'تعذر تحديث كلمة المرور.';
      msg.className = 'msg error';
      submitBtn.disabled = false;
      submitBtn.textContent = 'حفظ كلمة المرور الجديدة';
      return;
    }

    form.classList.add('hidden');
    sub.textContent = 'تم تحديث كلمة المرور بنجاح.';
    msg.textContent = 'يمكنك الآن تسجيل الدخول بكلمة المرور الجديدة.';
    msg.className = 'msg success';

    await supabaseClient.auth.signOut();
    setTimeout(() => {
      window.location.href = 'login.html';
    }, 1800);
  });

  establishRecoverySession();
</script>
</body>
</html>
