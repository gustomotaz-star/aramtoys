<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>My Account — Aram Toys</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Baloo+2:wght@600;700;800&family=Nunito+Sans:wght@400;600;700;800&family=Baloo+Bhaijaan+2:wght@600;700;800&family=Tajawal:wght@400;500;700;800&display=swap" rel="stylesheet">
<link rel="stylesheet" href="assets/css/rtl.css">
<style>
  :root{
    --cream:#FBF6EC; --ink:#2B2A4C; --coral:#FF6B5B; --mustard:#FFC145; --mint:#4ECDC4;
    --paper:#FFFFFF; --line: rgba(43,42,76,0.12);
  }
  *{box-sizing:border-box; margin:0; padding:0;}
  body{ background:var(--cream); color:var(--ink); font-family:'Nunito Sans', sans-serif; }
  a{color:inherit; text-decoration:none;}
  .wrap{ max-width:800px; margin:0 auto; padding:40px 24px; }

  header{ display:flex; align-items:center; justify-content:space-between; margin-bottom:32px; }
  .block-logo{ display:flex; gap:4px; }
  .block-logo .tile{
    width:30px; height:30px; border-radius:7px;
    display:flex; align-items:center; justify-content:center;
    font-family:'Baloo 2', sans-serif; font-weight:800; font-size:15px; color:var(--paper);
  }
  .block-logo .tile:nth-child(1){background:var(--coral);}
  .block-logo .tile:nth-child(2){background:var(--mustard); color:var(--ink);}
  .block-logo .tile:nth-child(3){background:var(--mint);}
  .block-logo .tile:nth-child(4){background:var(--ink);}

  .signout{ font-weight:700; font-size:14px; padding:10px 18px; border-radius:10px; border:2px solid var(--ink); cursor:pointer; background:transparent; font-family:inherit; }

  h1{ font-family:'Baloo 2', sans-serif; font-size:28px; margin-bottom:24px; }

  .card{ background:var(--paper); border:1px solid var(--line); border-radius:18px; padding:24px; margin-bottom:20px; }
  .card h2{ font-family:'Baloo 2', sans-serif; font-size:17px; margin-bottom:14px; }
  .row{ display:flex; justify-content:space-between; padding:8px 0; border-bottom:1px solid var(--line); font-size:14px; }
  .row:last-child{ border-bottom:none; }
  .row span:first-child{ color:rgba(43,42,76,0.6); }
  .empty{ color:rgba(43,42,76,0.55); font-size:14px; }
  .shop-btn{
    display:inline-block; padding:11px 22px; background:var(--coral); color:#fff;
    border-radius:12px; font-weight:800; font-size:14px; margin-bottom:24px;
  }
  .toggle-form{ font-size:13px; font-weight:700; color:var(--coral); cursor:pointer; background:none; border:none; padding:0; font-family:inherit; margin-top:12px; }
  form.addr-form{ display:none; margin-top:16px; }
  form.addr-form.open{ display:block; }
  form.addr-form input, form.addr-form select{
    width:100%; padding:11px 13px; border-radius:10px; border:2px solid var(--line);
    font-family:inherit; font-size:14px; margin-bottom:10px; background:var(--paper);
  }
  form.addr-form input:focus, form.addr-form select:focus{ outline:none; border-color:var(--mint); }
  .addr-form-row{ display:grid; grid-template-columns:1fr 1fr; gap:10px; }
  .save-addr-btn{
    padding:11px 20px; border-radius:10px; background:var(--ink); color:var(--cream);
    border:none; font-weight:700; cursor:pointer; font-family:inherit; font-size:13px;
  }
  .addr-msg{ font-size:12px; color:var(--coral); margin-top:8px; }

  #profile-form label{ display:block; font-size:12px; font-weight:700; color:rgba(43,42,76,0.6); margin-bottom:6px; margin-top:14px; }
  #profile-form label:first-child{ margin-top:0; }
  #profile-form input{
    width:100%; padding:11px 13px; border-radius:10px; border:2px solid var(--line);
    font-family:inherit; font-size:14px;
  }
  #profile-form input:focus{ outline:none; border-color:var(--mint); }
  #profile-form .save-addr-btn{ margin-top:16px; }
  .edit-profile-btn{ margin-top:14px; }
  .cancel-btn{ background:none; border:none; color:rgba(43,42,76,0.55); font-weight:700; cursor:pointer; font-family:inherit; font-size:13px; margin-inline-start:10px; }
</style>
</head>
<body>
<div class="wrap">
  <header>
    <a href="index.html" class="block-logo" aria-label="Aram Toys">
      <span class="tile">A</span><span class="tile">R</span><span class="tile">A</span><span class="tile">M</span>
    </a>
    <div style="display:flex; align-items:center; gap:12px;">
      <button class="lang-toggle" aria-label="Change language">English</button>
      <button class="signout" id="signout-btn" data-i18n="account_signout">Sign Out</button>
    </div>
  </header>

  <h1 data-i18n="account_title">My Account</h1>
  <a href="index.html" class="shop-btn" data-i18n="account_continue_shopping">Continue Shopping →</a>

  <div class="card">
    <h2 data-i18n="account_profile">Profile</h2>
    <div id="profile-view">
      <div class="row"><span data-i18n="account_name">Name</span><span id="view-name">—</span></div>
      <div class="row"><span data-i18n="account_email">Email</span><span id="view-email">—</span></div>
      <div class="row"><span data-i18n="account_phone">Phone</span><span id="view-phone">—</span></div>
      <button class="toggle-form edit-profile-btn" id="edit-profile-btn" type="button" data-i18n="account_edit_profile">✎ Edit Personal Info</button>
    </div>
    <form id="profile-form" style="display:none;">
      <label for="profile-name-input" data-i18n="account_name">Name</label>
      <input type="text" id="profile-name-input">

      <label for="profile-email-input" data-i18n="account_email">Email</label>
      <input type="email" id="profile-email-input">

      <label for="profile-phone-input" data-i18n="account_phone">Phone</label>
      <input type="tel" id="profile-phone-input">

      <button type="submit" class="save-addr-btn" data-i18n="account_save_profile">Save</button>
      <button type="button" class="cancel-btn" id="cancel-profile-btn" data-i18n="account_cancel">Cancel</button>
      <p class="addr-msg" id="profile-msg"></p>
    </form>
  </div>

  <div class="card">
    <h2 data-i18n="account_orders">My Orders</h2>
    <div id="orders-list" class="empty" data-i18n="account_no_orders">No orders yet.</div>
  </div>

  <div class="card">
    <h2 data-i18n="account_addresses">My Addresses</h2>
    <div id="addresses-list" class="empty" data-i18n="account_no_addresses">No saved addresses yet.</div>

    <button class="toggle-form" id="toggle-addr-form" type="button" data-i18n="account_add_address">+ Add Address</button>
    <form class="addr-form" id="addr-form">
      <select id="addr-label">
        <option value="Home" data-i18n="addr_label_home">Home</option>
        <option value="Work" data-i18n="addr_label_work">Work</option>
      </select>

      <div class="addr-form-row">
        <select id="addr-governorate"></select>
        <select id="addr-area"></select>
      </div>
      <input type="text" id="addr-area-other" data-i18n-placeholder="account_area_ph" placeholder="Area / District" style="display:none;">

      <input type="text" id="addr-street" data-i18n-placeholder="account_street_ph" placeholder="Street" required>

      <div class="addr-form-row">
        <input type="text" id="addr-floor" data-i18n-placeholder="account_floor_ph" placeholder="Floor">
        <input type="text" id="addr-apartment" data-i18n-placeholder="account_apartment_ph" placeholder="Apartment">
      </div>

      <button type="submit" class="save-addr-btn" data-i18n="checkout_save_address">Save Address</button>
      <p class="addr-msg" id="addr-msg"></p>
    </form>
  </div>

  <div style="text-align:center; margin-top:20px;">
    <button class="lang-toggle" aria-label="Change language">English</button>
  </div>
</div>

<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2/dist/umd/supabase.js"></script>
<script src="assets/js/supabase-client.js"></script>
<script src="assets/js/i18n.js"></script>
<script src="assets/js/cart.js"></script>
<script src="assets/js/egypt-locations.js"></script>
<script>
  async function init() {
    const { data: { session } } = await supabaseClient.auth.getSession();
    if (!session) { window.location.href = 'login.html'; return; }

    const user = session.user;

    const { data: profile } = await supabaseClient
      .from('profiles')
      .select('full_name, email, phone')
      .eq('id', user.id)
      .single();

    if (profile) {
      document.getElementById('profile-name-input').value = profile.full_name || '';
      document.getElementById('profile-email-input').value = profile.email || '';
      document.getElementById('profile-phone-input').value = profile.phone || '';
      document.getElementById('view-name').textContent = profile.full_name || '—';
      document.getElementById('view-email').textContent = profile.email || '—';
      document.getElementById('view-phone').textContent = profile.phone || '—';
    }

    const { data: orders } = await supabaseClient
      .from('orders')
      .select('id, status, payment_status, total, created_at')
      .eq('customer_id', user.id)
      .order('created_at', { ascending: false });

    if (orders && orders.length) {
      document.getElementById('orders-list').innerHTML = orders.map(o => `
        <div class="row">
          <span>${new Date(o.created_at).toLocaleDateString()} — ${o.status}</span>
          <span>${Number(o.total).toFixed(0)} EGP (${o.payment_status})</span>
        </div>
      `).join('');
    }

    await loadAddresses(user.id);
  }

  async function loadAddresses(userId) {
    const { data: addresses } = await supabaseClient
      .from('addresses')
      .select('label, full_address, city, governorate')
      .eq('customer_id', userId);

    const listEl = document.getElementById('addresses-list');
    if (addresses && addresses.length) {
      listEl.innerHTML = addresses.map(a => `
        <div class="row">
          <span>${a.label || 'Address'}</span>
          <span>${a.full_address}, ${a.city || ''} ${a.governorate || ''}</span>
        </div>
      `).join('');
    } else {
      listEl.textContent = t('account_no_addresses');
    }
  }

  document.getElementById('toggle-addr-form').addEventListener('click', () => {
    document.getElementById('addr-form').classList.toggle('open');
  });

  function populateGovernorates() {
    const sel = document.getElementById('addr-governorate');
    sel.innerHTML = EGYPT_GOVERNORATES.map(g => `<option value="${g.name}">${g.name}</option>`).join('');
    sel.value = 'القاهرة';
    populateAreas();
  }

  function populateAreas() {
    const gov = document.getElementById('addr-governorate').value;
    const govData = EGYPT_GOVERNORATES.find(g => g.name === gov);
    const areas = govData ? govData.areas : [];
    const areaSel = document.getElementById('addr-area');
    areaSel.innerHTML = areas.map(a => `<option value="${a}">${a}</option>`).join('')
      + `<option value="__other__">${t('addr_area_other')}</option>`;
    document.getElementById('addr-area-other').style.display = 'none';
    document.getElementById('addr-area-other').value = '';
  }

  document.getElementById('addr-governorate').addEventListener('change', populateAreas);
  document.getElementById('addr-area').addEventListener('change', () => {
    document.getElementById('addr-area-other').style.display =
      document.getElementById('addr-area').value === '__other__' ? 'block' : 'none';
  });
  document.addEventListener('langchange', () => {
    const currentArea = document.getElementById('addr-area').value;
    populateAreas();
    document.getElementById('addr-area').value = currentArea;
  });

  populateGovernorates();

  document.getElementById('addr-form').addEventListener('submit', async (e) => {
    e.preventDefault();
    const msg = document.getElementById('addr-msg');
    msg.textContent = '';

    const { data: { user } } = await supabaseClient.auth.getUser();
    if (!user) { window.location.href = 'login.html'; return; }

    const street = document.getElementById('addr-street').value.trim();
    const floor = document.getElementById('addr-floor').value.trim();
    const apartment = document.getElementById('addr-apartment').value.trim();

    let fullAddress = street;
    if (floor) fullAddress += ` — Floor ${floor}`;
    if (apartment) fullAddress += ` — Apt ${apartment}`;

    const areaValue = document.getElementById('addr-area').value === '__other__'
      ? document.getElementById('addr-area-other').value.trim()
      : document.getElementById('addr-area').value;

    const payload = {
      customer_id: user.id,
      label: document.getElementById('addr-label').value,
      full_address: fullAddress,
      city: areaValue,
      governorate: document.getElementById('addr-governorate').value
    };

    const { error } = await supabaseClient.from('addresses').insert(payload);
    if (error) { msg.textContent = error.message; return; }

    document.getElementById('addr-form').reset();
    document.getElementById('addr-form').classList.remove('open');
    populateGovernorates();
    await loadAddresses(user.id);
  });

  document.getElementById('edit-profile-btn').addEventListener('click', () => {
    document.getElementById('profile-view').style.display = 'none';
    document.getElementById('profile-form').style.display = 'block';
    document.getElementById('profile-msg').textContent = '';
  });

  document.getElementById('cancel-profile-btn').addEventListener('click', () => {
    document.getElementById('profile-name-input').value = document.getElementById('view-name').textContent === '—' ? '' : document.getElementById('view-name').textContent;
    document.getElementById('profile-email-input').value = document.getElementById('view-email').textContent === '—' ? '' : document.getElementById('view-email').textContent;
    document.getElementById('profile-phone-input').value = document.getElementById('view-phone').textContent === '—' ? '' : document.getElementById('view-phone').textContent;
    document.getElementById('profile-msg').textContent = '';
    document.getElementById('profile-form').style.display = 'none';
    document.getElementById('profile-view').style.display = 'block';
  });

  document.getElementById('profile-form').addEventListener('submit', async (e) => {
    e.preventDefault();
    const msg = document.getElementById('profile-msg');
    msg.textContent = '';
    msg.style.color = 'var(--coral)';

    const { data: { user } } = await supabaseClient.auth.getUser();
    if (!user) { window.location.href = 'login.html'; return; }

    const payload = {
      full_name: document.getElementById('profile-name-input').value.trim() || null,
      email: document.getElementById('profile-email-input').value.trim() || null,
      phone: document.getElementById('profile-phone-input').value.trim() || null
    };

    const { error } = await supabaseClient.from('profiles').update(payload).eq('id', user.id);
    if (error) {
      msg.textContent = error.message;
      return;
    }

    document.getElementById('view-name').textContent = payload.full_name || '—';
    document.getElementById('view-email').textContent = payload.email || '—';
    document.getElementById('view-phone').textContent = payload.phone || '—';
    document.getElementById('profile-form').style.display = 'none';
    document.getElementById('profile-view').style.display = 'block';
  });

  document.getElementById('signout-btn').addEventListener('click', async () => {
    await supabaseClient.auth.signOut();
    clearCart();
    window.location.href = 'index.html';
  });

  init();
</script>
</body>
</html>
